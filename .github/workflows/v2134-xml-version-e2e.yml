name: SkillSpector 2.13.4 XML source-bound read-only E2E

on:
  pull_request:
    paths:
      - ".github/workflows/v2134-xml-version-e2e.yml"
      - "src/skillspector/references.py"
      - "tests/test_xml_version_references.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 777genius/SkillSpector
          ref: c4816448b85fceaaf4291cb552e2de38562d1348
          persist-credentials: false
          path: old
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: new
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: indranilbanerjee/digital-marketing-pro
          ref: be4142b25bba6d424962a7788432dd813e6b768c
          sparse-checkout: skills/sitemap-manager
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: teachskillofskills-ai/digitalmarketingpro-techshu
          ref: e97a5bdd91601024a9cfa870807a8d3c81dc3caf
          sparse-checkout: skills/sitemap-manager
          persist-credentials: false
          path: source-two
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Exact refs, locked dependencies, Ruff and adversarial tests
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = c4816448b85fceaaf4291cb552e2de38562d1348
          test "$(git -C new rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C source rev-parse HEAD)" = be4142b25bba6d424962a7788432dd813e6b768c
          test "$(git -C source hash-object skills/sitemap-manager/SKILL.md)" = c1f6817e2f509ce7235bcfb358c6e05de3b15c3f
          test "$(git -C source-two rev-parse HEAD)" = e97a5bdd91601024a9cfa870807a8d3c81dc3caf
          test "$(git -C source-two hash-object skills/sitemap-manager/SKILL.md)" = 51556ed177324bb912bfd9ac950ddac3998b747f
          python3 -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --directory old --frozen --no-dev --python 3.12
          uv sync --directory new --frozen --extra dev --python 3.12
          new/.venv/bin/ruff check new/src/skillspector/references.py new/tests/test_xml_version_references.py
          new/.venv/bin/ruff format --check new/src/skillspector/references.py new/tests/test_xml_version_references.py
          new/.venv/bin/python -m pytest -q new/tests/test_xml_version_references.py new/tests/test_json_version_reference_scope.py
      - name: Immutable two-source old/new no-LLM proof
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path

          CASES = (
              ("digital-marketing-pro", Path("source/skills/sitemap-manager"),
               "be4142b25bba6d424962a7788432dd813e6b768c",
               "c1f6817e2f509ce7235bcfb358c6e05de3b15c3f",
               "sha256:eff54074a793819f05c51e14ae0f434c7c0227cf40927e9ceb84074e64108d1f",
               (79, 90)),
              ("digitalmarketingpro-techshu", Path("source-two/skills/sitemap-manager"),
               "e97a5bdd91601024a9cfa870807a8d3c81dc3caf",
               "51556ed177324bb912bfd9ac950ddac3998b747f",
               "sha256:0de31e93faf698d08dabacd84c76ee5094ede38feaefa3ef37c1bda69f7222bd",
               (75, 86)),
          )
          DOMAIN = b"agentplugins.package-tree\x00sha256\x00v1"

          def tree_digest(root):
              rows = []
              for path in root.rglob("*"):
                  relative = path.relative_to(root).as_posix()
                  assert not path.is_symlink(), f"symlink in immutable source: {relative}"
                  if path.is_dir():
                      rows.append((relative.encode(), b"directory", b"040000", b"", b""))
                  elif path.is_file():
                      mode = b"100755" if path.stat().st_mode & 0o111 else b"100644"
                      rows.append((relative.encode(), b"file", mode, b"", path.read_bytes()))
                  else:
                      raise AssertionError(f"unsupported source entry: {relative}")
              digest = hashlib.sha256()
              digest.update(len(DOMAIN).to_bytes(8, "big"))
              digest.update(DOMAIN)
              for relative, kind, mode, target, content in sorted(rows, key=lambda row: row[0]):
                  for field in (b"entry", relative, kind, mode, target):
                      digest.update(len(field).to_bytes(8, "big"))
                      digest.update(field)
                  digest.update(len(content).to_bytes(8, "big"))
                  if kind == b"file":
                      digest.update(content)
              return "sha256:" + digest.hexdigest(), len(rows)

          def scan(cli, source):
              with tempfile.TemporaryDirectory(prefix="xml-proof-") as home:
                  process = subprocess.run(
                      [str(cli.resolve()), "scan", str(source.resolve()),
                       "--no-llm", "--format", "json", "--fail-on-incomplete"],
                      env={**os.environ, "HOME": home, "OPENAI_API_KEY": ""},
                      capture_output=True, text=True, timeout=180, check=False)
              assert process.returncode in (0, 1), (process.returncode, process.stderr[-600:])
              report = json.loads(process.stdout)
              assert report["metadata"]["skillspector_version"] == "2.13.4"
              assert report["metadata"]["llm_requested"] is False
              assert report["metadata"]["inference_usage"] == []
              assert report["execution_successful"] is True
              assert report["suppressed_count"] == 0 and report["suppressed"] == []
              return report, process.returncode

          def key(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          def independent_issues(report):
              rows = []
              for issue in report["issues"]:
                  if issue.get("id") in {"AE1", "AE7"} and issue.get("tags") == ["coverage"]:
                      continue
                  item = dict(issue)
                  finding_id = item.get("finding_id")
                  if isinstance(finding_id, str) and re.fullmatch(r"finding-[0-9a-f]{32}", finding_id):
                      item.pop("finding_id")
                  rows.append(key(item))
              return collections.Counter(rows)

          results = []
          for name, source, revision, expected_blob, expected_tree, expected_lines in CASES:
              assert source.is_dir() and not source.is_symlink(), f"{name}: source root missing or redirected"
              entries = list(source.rglob("*"))
              assert len(entries) == 1 and entries[0].name == "SKILL.md" and entries[0].is_file()
              assert not entries[0].is_symlink()
              body = entries[0].read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest()
              assert blob == expected_blob, f"{name}: immutable SKILL.md blob changed"
              digest, count = tree_digest(source)
              assert digest == expected_tree and count == 1, f"{name}: signed original source tree changed"

              old, old_code = scan(Path("old/.venv/bin/skillspector"), source)
              assert tree_digest(source)[0] == digest, f"{name}: old scanner modified source"
              new, new_code = scan(Path("new/.venv/bin/skillspector"), source)
              assert tree_digest(source)[0] == digest, f"{name}: candidate scanner modified source"

              old_refs = old["analysis_completeness"]["references"]
              new_refs = new["analysis_completeness"]["references"]
              missing = [item for item in old_refs
                  if item.get("source_path") == "SKILL.md"
                  and item.get("line") in expected_lines
                  and item.get("reference_kind") == "quoted_or_code"
                  and item.get("status") == "missing"
                  and item.get("evidence") == '<?xml version="1.0" encoding="UTF-8"?>']
              assert len(missing) == 2 and {item["line"] for item in missing} == set(expected_lines), (
                  f"{name}: expected exactly two strict XML prolog false positives")
              assert (collections.Counter(map(key, old_refs)) -
                      collections.Counter(map(key, new_refs))) == collections.Counter(map(key, missing)), (
                          f"{name}: unexpected reference evidence removed")
              assert not (collections.Counter(map(key, new_refs)) -
                          collections.Counter(map(key, old_refs))), f"{name}: candidate added reference rows"
              assert independent_issues(old) == independent_issues(new), (
                  f"{name}: independent security finding changed")

              coverage = new["analysis_completeness"]
              old_coverage = old["analysis_completeness"]
              # 2.13.4 already treats a missing passive XML literal as a caveat
              # (exit 0), unlike the published 2.13.1 Partial (exit 1).
              # Preserve the actual baseline status; only the candidate must
              # genuinely become Complete, with no hidden security findings.
              assert old_coverage["status"] in {"partial", "complete_with_caveats"}
              assert old_code == (0 if old_coverage["is_complete"] else 1)
              assert new_code == 0, (
                  f"{name}: cannot certify scanner regression: old_exit={old_code}, "
                  f"new_exit={new_code}, "
                  f"old_status={old['analysis_completeness'].get('status')!r}, "
                  f"new_status={coverage.get('status')!r}, "
                  f"new_reasons={coverage.get('reasons')!r}, "
                  f"new_uninspected={coverage.get('entirely_uninspected_files')!r}, "
                  f"new_partial={coverage.get('partially_inspected_files')!r}, "
                  f"remaining_refs={len(new_refs)}"
              )
              assert coverage["status"] == "complete" and coverage["is_complete"] is True, (
                  f"{name}: scanner did not produce a genuinely Complete result")
              assert coverage["partially_inspected_files"] == 0
              assert coverage["entirely_uninspected_files"] == 0
              assert all(item["status"] == "resolved" for item in new_refs)
              results.append({
                  "name": name, "source_revision": revision, "source_blob": blob,
                  "source_tree_sha256": digest, "source_entries": count,
                  "removed_missing_reference_rows": len(missing),
                  "old_status": old["analysis_completeness"]["status"],
                  "new_status": coverage["status"], "old_exit": old_code,
                  "new_exit": new_code, "security_findings_preserved": True,
                  "source_bytes_unchanged": True,
                  "production_partial_reduction": 0,
              })

          result = {
              "schema_version": 1, "kind": "xml-v2134-two-source-readonly",
              "source_count": len(results), "results": results,
              "original_scanner": "c4816448b85fceaaf4291cb552e2de38562d1348",
              "candidate_scanner": subprocess.check_output(
                  ["git", "-C", "new", "rev-parse", "HEAD"], text=True).strip(),
              "production_partial_reduction": 0, "production_modified": False,
              "safe_for_automatic_publication": False,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "xml-source-proof"
          output.mkdir(parents=True, exist_ok=True)
          (output / "proof.json").write_text(json.dumps(result, sort_keys=True, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Preserve bounded proof, no publication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skillspector-2134-xml-source-proof
          path: ${{ runner.temp }}/xml-source-proof/
          if-no-files-found: warn
          retention-days: 7
